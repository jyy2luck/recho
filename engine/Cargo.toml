[package]
name = "recho-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "recho_core"
crate-type = ["rlib"]

[dependencies]
bytes = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
brotli = "8"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http2"] }
libc = "0.2"
if-addrs = "0.15"
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
regex = "1"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.9"
rquickjs = { version = "0.11", default-features = false, features = ["std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rcgen = { version = "0.13.2", features = ["x509-parser"] }
x509-parser = "0.16"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
tun2proxy = { version = "=0.8.7", default-features = false }
rquickjs = { version = "0.11", default-features = false, features = ["bindgen"] }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Authorization", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Threading", "Win32_Networking_WinInet"] }
