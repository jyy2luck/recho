name: Package desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            filename: recho-macos-arm64.zip
          - runner: windows-2025
            filename: recho-windows-x64.zip
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_PATH: dist/${{ matrix.filename }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> app/build"
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          ./scripts/build.sh
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent app/build/release/recho.app "$PACKAGE_PATH"
      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          ./scripts/build.ps1
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -LiteralPath app/build/release/recho.exe, desktop/assets/fonts/Geist-OFL.txt -DestinationPath $env:PACKAGE_PATH -Force
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PACKAGE_PATH }}
          archive: false
          if-no-files-found: error
          overwrite: true
